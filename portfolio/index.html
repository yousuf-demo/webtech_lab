<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yousuf Showrov Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h2>Yousuf Showrov</h2>
        <button id="themeToggle">🌙</button>
    </nav>
</header>

<main>

    
    <section id="home">
        <div class="hero-left">
            <h1>Hi, I’m Yousuf Showrov</h1>
            <h3>I am a <span id="dynamic-text"></span></h2>
        </div>
        <div class="hero-right">
            <img src="images/hero.png" alt="Yousuf Showrov">
        </div>
    </section>

    <section id="projects">
        <h2>My Projects</h2>
        <div id="projectContainer"></div>
    </section>

    
    <section id="contact">
        <h2>Contact Me</h2>
        <form id="contactForm">
            <input type="text" id="name" placeholder="Your Name"><small></small>
            <input type="email" id="email" placeholder="Your Email"><small></small>
            <input type="text" id="subject" placeholder="Subject"><small></small>
            <textarea id="message" placeholder="Message"></textarea><small></small>
            <button type="submit">Send</button>
        </form>
    </section>

</main>

<footer>
    <p>© 2026 Yousuf Showrov</p>
</footer>

<script src="script.js"></script>
</body>
</html>
