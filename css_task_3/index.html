<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model & Display Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Box Model & Display Properties</h1>

    
    <h2>Box Model Example</h2>
    <div class="box1">Box 1 (default box-sizing)</div>
    <div class="box2">Box 2 (border-box)</div>
    <div class="box3">Box 3 (more padding & margin)</div>

    
    <h2>Display Properties</h2>
    <div class="block-box">This is a block div</div>
    <span class="inline-span">Inline span</span>
    <span class="inline-block-span">Inline-block span</span>
    <p class="hidden-display">This paragraph is hidden with display: none</p>
    <p class="hidden-visibility">This paragraph is hidden with visibility: hidden</p>

</body>
</html>
