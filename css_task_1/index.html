<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Lab Task</title>


    <link rel="stylesheet" href="style.css">

    
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .highlight {
            color: green;
            font-weight: bold;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

    
    <h1 id="mainTitle">CSS Lab Task</h1>

    
    <p style="color: red; font-size: 18px;">
        This paragraph uses inline CSS.
    </p>

    <p>
        This paragraph is styled using internal and external CSS.
    </p>

    <p class="highlight">
        This paragraph uses a class selector (.highlight).
    </p>

</body>
</html>
